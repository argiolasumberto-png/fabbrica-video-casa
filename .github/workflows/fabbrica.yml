name: Fabbrica video casa

on:
  workflow_dispatch:
    inputs:
      tema:
        description: "Argomento (lascia vuoto e lo scelgono gli agenti)"
        required: false
        default: ""
      quante:
        description: "Quante puntate"
        required: false
        default: "1"
  schedule:
    - cron: "0 6 * * 1"   # ogni lunedi alle 7 (ora italiana d'inverno): 3 puntate

permissions:
  contents: write
  id-token: write

jobs:
  produci:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Rete di agenti
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: '--max-turns 120 --allowedTools "Read,Write,Edit,Glob,Grep,Task,WebSearch,WebFetch"'
          prompt: |
            Avvia la fabbrica seguendo CLAUDE.md.
            Tema: "${{ inputs.tema }}" (se vuoto, usa il cacciatore-temi).
            Numero di puntate: ${{ inputs.quante || '3' }}.
            Data di oggi: usa la data del sistema per il nome delle cartelle.
            Salva tutto in puntate/ e aggiorna puntate/INDICE.md.

      - name: Salva le puntate nel repository
        run: |
          git config user.name "fabbrica-bot"
          git config user.email "fabbrica-bot@users.noreply.github.com"
          git add puntate
          git diff --cached --quiet || git commit -m "Nuove puntate $(date +%F)"
          git push
